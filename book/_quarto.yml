project:
  type: book
  output-dir: _site
  render:
    - "*.qmd"
  resources:
    - CNAME

book:
  title: "Electrophysiology Pipeline Plan"
  search: true
  page-navigation: true
  site-url: https://ephys-pipeline-planning.neuroinformatics.dev
  sidebar:
    title: "Ephys Pipeline<br>Planning"
    style: docked
    collapse-level: 1
  page-footer:
    left: "Electrophysiology Pipeline Plan"
    right: "Built with [Quarto](https://quarto.org)."
  chapters:
    - href: index.qmd
      text: "Overview"
    - part: "Spec"
      chapters:
        - href: data-loader.qmd
          text: "Data loader"
        - href: pipeline-steps.qmd
          text: "Pipeline steps"
        - href: outputs.qmd
          text: "Inputs and Outputs"
        - href: config.qmd
          text: "Config"
        - href: directory-definitions.qmd
          text: "Directory definitions"
    - implementation.qmd
    - modular-architecture.qmd
    - definitions.qmd
    - scope.qmd
    - roadmap.qmd

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 3
    toc-expand: true
    number-sections: false
    fig-align: center
    link-external-newwindow: true